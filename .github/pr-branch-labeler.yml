# Apply label "🚀 Dev" if head branch matches dev-frontend
🚀 Dev:
  base: "dev-frontend"
  head: "MV-*"

🧪 QA:
  base: "qa-frontend"
  head: "MV-*"

✅ UAT:
  base: "uat-frontend"
  head: "MV-*"

🧪 QA to ✅ UAT:
  base: "uat-frontend"
  head: "qa-frontend"

🚀 Dev to 🧪 QA:
  base: "qa-frontend"
  head: "dev-frontend"
